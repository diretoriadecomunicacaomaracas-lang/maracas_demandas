<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipo — Gestão de Demandas · Comunicação · Prefeitura de Maracás</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Marca */
  --azul:#028EFF; --ciano:#0EC7FF; --verdelimao:#8EEA00; --amarelo:#FFC605;
  --laranja:#FF9E22; --laranjaverm:#FF6729; --vermelho:#FF3B2B;
  --verde:#4ED980;
  /* Neutros */
  --bg:#F7F8FA; --surface:#FFFFFF; --surface2:#F2F4F7; --border:#E6E9EF;
  --text:#1F2430; --text2:#5B6472; --text3:#98A1B0; --disabled:#EEF1F5;
  /* Pastéis de status */
  --p-azul:#E7F3FF; --t-azul:#0A5FB0;
  --p-ciano:#E4F8FF; --t-ciano:#0784A6;
  --p-verde:#E6F8EE; --t-verde:#1B7F4B;
  --p-amarelo:#FFF6DA; --t-amarelo:#8A6A00;
  --p-laranja:#FFF0E0; --t-laranja:#9A5A08;
  --p-lverm:#FFE9E1; --t-lverm:#B23E17;
  --p-vermelho:#FFE7E5; --t-vermelho:#B32219;
  --p-cinza:#EEF1F5; --t-cinza:#5B6472;
  --shadow-sm:0 1px 2px rgba(16,24,40,.06);
  --shadow-md:0 6px 20px rgba(16,24,40,.08);
  --shadow-lg:0 16px 40px rgba(16,24,40,.16);
  --radius:10px; --radius-lg:14px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--text);background:var(--bg);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{color:var(--azul);text-decoration:none}
img{max-width:100%}
.tex{background-image:radial-gradient(var(--border) 1px, transparent 1px);background-size:22px 22px;opacity:.5}
/* App shell */
#app{height:100vh;overflow:hidden}
.hidden{display:none!important}
/* Botões */
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:var(--radius);height:40px;padding:0 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;transition:.15s}
.btn:hover{background:var(--surface2)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn.primary{background:var(--azul);border-color:var(--azul);color:#fff}
.btn.primary:hover{background:#0277d6}
.btn.ghost{border-color:transparent;background:transparent;color:var(--azul)}
.btn.ghost:hover{background:var(--p-azul)}
.btn.danger{border-color:#f3c7c3;color:var(--t-vermelho);background:#fff}
.btn.danger:hover{background:var(--p-vermelho)}
.btn:disabled{background:var(--disabled);color:var(--text3);border-color:var(--border);cursor:not-allowed}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid transparent;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--text2);position:relative}
.iconbtn:hover{background:var(--surface2);color:var(--text)}
/* Chips e status */
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--p-cinza);color:var(--t-cinza);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.9}
.st-planejamento{background:var(--p-amarelo);color:var(--t-amarelo)}
.st-producao{background:var(--p-laranja);color:var(--t-laranja)}
.st-revisao{background:var(--p-ciano);color:var(--t-ciano)}
.st-aprovacao{background:var(--p-lverm);color:var(--t-lverm)}
.st-correcao{background:var(--p-vermelho);color:var(--t-vermelho)}
.st-aprovado{background:var(--p-verde);color:var(--t-verde)}
.st-publicacao{background:var(--p-amarelo);color:var(--t-amarelo)}
.st-publicado{background:var(--p-verde);color:var(--t-verde)}
.st-info{background:var(--p-azul);color:var(--t-azul)}
.st-neutro{background:var(--p-cinza);color:var(--t-cinza)}
.st-atraso{background:var(--p-vermelho);color:var(--t-vermelho)}
.badge{position:absolute;top:4px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--vermelho);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pri{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.pri .dt{width:8px;height:8px;border-radius:2px;transform:rotate(45deg)}
.pri-alta .dt{background:var(--laranjaverm)} .pri-media .dt{background:var(--amarelo)} .pri-baixa .dt{background:var(--text3)}
.pri-emerg{color:var(--t-vermelho)} .pri-emerg .dt{background:var(--vermelho)}
/* Avatares */
.av{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.av.lg{width:40px;height:40px;font-size:14px}
.avstack{display:inline-flex} .avstack .av{margin-left:-8px;border:2px solid #fff} .avstack .av:first-child{margin-left:0}
/* Layout interno */
.shell{display:flex;height:100vh}
.side{width:248px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:width .18s;flex:none}
.side.collapsed{width:64px}
.side .brand{height:60px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border)}
.side .brand .logo{height:26px}
.side.collapsed .brand .logo{display:none}
.side .brand .neutralicon{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--azul),var(--ciano));display:none;align-items:center;justify-content:center;color:#fff;font-weight:800;flex:none}
.side.collapsed .brand .neutralicon{display:flex}
.navlist{padding:10px 8px;overflow:auto;flex:1}
.navsec{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--text3);text-transform:uppercase;padding:12px 12px 6px}
.navitem{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:10px;color:var(--text2);font-weight:500;font-size:14px;position:relative;margin:2px 0;white-space:nowrap;overflow:hidden}
.navitem:hover{background:var(--surface2);color:var(--text)}
.navitem.active{background:var(--p-azul);color:var(--azul);font-weight:600}
.navitem.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--azul)}
.navitem .ic{width:20px;text-align:center;flex:none}
.side.collapsed .navitem span.lbl,.side.collapsed .navsec{display:none}
.side.collapsed .navitem{justify-content:center;padding:0}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:60px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex:none}
.search{flex:1;max-width:520px;height:40px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--text3)}
.search input{border:none;background:transparent;outline:none;flex:1;font-family:inherit;font-size:14px;color:var(--text)}
.topbar .spacer{flex:1}
.userbox{display:flex;align-items:center;gap:10px;padding:4px 6px;border-radius:10px}
.userbox:hover{background:var(--surface2)}
.userbox .u-name{font-size:13px;font-weight:600;line-height:1.1}
.userbox .u-role{font-size:11px;color:var(--text2)}
.content{flex:1;overflow:auto;padding:24px}
.page-h{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page-h h1{font-size:22px;font-weight:700;margin:0}
.page-h p{margin:4px 0 0;color:var(--text2);font-size:13px}
.page-h .spacer{flex:1}
/* Abas de visualização */
.viewtabs{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.viewtab{height:32px;padding:0 12px;border:none;background:transparent;border-radius:8px;font-weight:600;font-size:13px;color:var(--text2);display:inline-flex;align-items:center;gap:6px}
.viewtab.active{background:var(--surface);color:var(--azul);box-shadow:var(--shadow-sm)}
.toolbar{display:flex;align-items:center;gap:8px;margin:14px 0;flex-wrap:wrap}
/* Cards / painéis */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
.kpi{padding:16px;display:flex;flex-direction:column;gap:6px}
.kpi .k-top{display:flex;align-items:center;justify-content:space-between}
.kpi .k-val{font-size:26px;font-weight:800;letter-spacing:-.01em}
.kpi .k-lab{font-size:13px;color:var(--text2)}
.kpi .k-ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px}
.grid{display:grid;gap:16px}
/* Tabela */
.tablewrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
table.dt{width:100%;border-collapse:collapse;font-size:13.5px}
table.dt th{background:var(--surface2);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--text2);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
table.dt td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
table.dt tr:last-child td{border-bottom:none}
table.dt tbody tr:hover{background:var(--surface2)}
.grouprow td{background:#fbfcfe;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--text2);padding:9px 12px;border-bottom:1px solid var(--border)}
.groupbar{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:8px;vertical-align:middle}
.cellmeta{display:inline-flex;align-items:center;gap:4px;color:var(--text3);font-size:12px;margin-left:8px}
.linktitle{font-weight:600;color:var(--text)}
.linktitle:hover{color:var(--azul);cursor:pointer}
/* Kanban */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.kcol{width:280px;flex:none;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px;max-height:calc(100vh - 230px);overflow:auto}
.kcol h4{margin:2px 6px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--text2);display:flex;align-items:center;gap:8px}
.kcol h4 .cnt{margin-left:auto;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:0 7px;font-size:11px;color:var(--text2)}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-sm);padding:10px;margin-bottom:10px;position:relative;overflow:hidden;cursor:grab}
.kcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--azul)}
.kcard .k-title{font-weight:600;font-size:13.5px;margin:2px 0 8px}
.kcard .k-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.kcard .k-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.kcard .k-ic{color:var(--text3);font-size:12px;display:inline-flex;gap:3px;align-items:center}
.kcard.drag{opacity:.5;outline:2px dashed var(--azul)}
/* Drawer */
.overlay{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:40;display:flex;justify-content:flex-end}
.drawer{width:560px;max-width:96vw;height:100%;background:var(--surface);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:slidein .2s ease}
@keyframes slidein{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
.drawer .d-head{padding:16px 18px;border-bottom:1px solid var(--border)}
.drawer .d-tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--border);overflow-x:auto}
.dtab{padding:11px 12px;font-size:13px;font-weight:600;color:var(--text2);border-bottom:2px solid transparent;white-space:nowrap}
.dtab.active{color:var(--azul);border-bottom-color:var(--azul)}
.drawer .d-body{padding:18px;overflow:auto;flex:1}
.kv{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px}
.kv .k{width:150px;color:var(--text2);flex:none}
.kv .v{color:var(--text);font-weight:500}
/* Modal */
.modal{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:480px;max-width:94vw;margin:auto;overflow:hidden;animation:pop .16s ease}
@keyframes pop{from{transform:scale(.97);opacity:.7}to{transform:none;opacity:1}}
.modal .m-head{padding:16px 18px;border-bottom:1px solid var(--border);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:space-between}
.modal .m-body{padding:18px}
.modal .m-foot{padding:14px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.center-overlay{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:50;display:flex;padding:20px}
/* Forms */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text)}
.field input,.field select,.field textarea{width:100%;height:40px;border:1px solid var(--border);border-radius:10px;padding:0 12px;font-family:inherit;font-size:14px;background:var(--surface);color:var(--text);outline:none}
.field textarea{height:auto;padding:10px 12px;min-height:88px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--azul);box-shadow:0 0 0 3px rgba(2,142,255,.15)}
.field .hint{font-size:12px;color:var(--text2);margin-top:5px}
.field .err{font-size:12px;color:var(--t-vermelho);margin-top:5px;display:flex;align-items:center;gap:5px}
.alert{border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;gap:10px;font-size:13px;align-items:flex-start}
.alert.info{background:var(--p-azul);border-color:#cbe6ff;color:var(--t-azul)}
.alert.warn{background:var(--p-amarelo);border-color:#f2e2a6;color:var(--t-amarelo)}
.alert.ok{background:var(--p-verde);border-color:#bfe9cf;color:var(--t-verde)}
.alert.crit{background:var(--p-vermelho);border-color:#f3c7c3;color:var(--t-vermelho)}
/* Calendário */
.cal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.cal .c-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal .c-dow{padding:8px;text-align:center;font-size:11px;text-transform:uppercase;color:var(--text2);font-weight:700;border-bottom:1px solid var(--border);background:var(--surface2)}
.cal .c-cell{min-height:104px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:6px;font-size:12px}
.cal .c-cell:nth-child(7n){border-right:none}
.c-daynum{font-size:12px;color:var(--text2);font-weight:600;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.c-today .c-daynum{background:var(--azul);color:#fff}
.c-ev{margin-top:4px;padding:3px 6px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-info{background:var(--p-azul);color:var(--t-azul)} .ev-plan{background:var(--p-amarelo);color:var(--t-amarelo)}
.ev-prod{background:var(--p-laranja);color:var(--t-laranja)} .ev-ok{background:var(--p-verde);color:var(--t-verde)}
.ev-atraso{background:var(--p-vermelho);color:var(--t-vermelho)}
.c-out{background:#fbfcfe;color:var(--text3)}
/* Conversas */
.chat{display:flex;height:calc(100vh - 60px)}
.chat .c-groups{width:260px;border-right:1px solid var(--border);background:var(--surface);overflow:auto;flex:none}
.chat .c-groups .g{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.chat .c-groups .g:hover{background:var(--surface2)}
.chat .c-groups .g.active{background:var(--p-azul)}
.chat .c-main{flex:1;display:flex;flex-direction:column;min-width:0}
.chat .c-head{height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;background:var(--surface)}
.chat .c-msgs{flex:1;overflow:auto;padding:16px;background:var(--bg)}
.msg{display:flex;gap:10px;margin-bottom:14px;max-width:720px}
.msg .m-b{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:9px 12px;font-size:13.5px}
.msg .m-meta{font-size:11px;color:var(--text2);margin-bottom:3px}
.msg .m-b a{font-weight:600}
.mention{background:var(--p-azul);color:var(--t-azul);border-radius:5px;padding:0 4px;font-weight:600}
.chat .c-input{border-top:1px solid var(--border);padding:12px 16px;background:var(--surface);display:flex;gap:8px}
.chat .c-input input{flex:1;height:42px;border:1px solid var(--border);border-radius:10px;padding:0 12px;font-family:inherit;font-size:14px;outline:none}
.unread{margin-left:auto;background:var(--vermelho);color:#fff;border-radius:999px;min-width:18px;height:18px;padding:0 5px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
/* Portais externos */
.portal{min-height:100vh;background:var(--bg)}
.portal .p-top{height:64px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 20px}
.portal .p-top .logo{height:30px}
.portal .p-wrap{max-width:960px;margin:0 auto;padding:24px 20px}
.stepper{display:flex;gap:6px;margin:0 0 18px;flex-wrap:wrap}
.step{flex:1;min-width:120px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--text2);background:var(--surface)}
.step.active{border-color:var(--azul);color:var(--azul);font-weight:700;background:var(--p-azul)}
.step.done{border-color:#bfe9cf;color:var(--t-verde);background:var(--p-verde)}
.step .n{font-weight:800;margin-right:6px}
/* Login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login .box{width:420px;max-width:96vw;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-md);padding:30px}
.login .logo{height:52px;display:block;margin:6px auto 18px}
.login h2{margin:0 0 4px;text-align:center;font-size:19px}
.login p.sub{margin:0 0 20px;text-align:center;color:var(--text2);font-size:13px}
/* Env switcher (apenas demonstração do protótipo) */
.envbar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:60;background:var(--surface);border:1px solid var(--border);border-radius:999px;box-shadow:var(--shadow-md);display:flex;gap:4px;padding:5px}
.envbar button{border:none;background:transparent;border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--text2)}
.envbar button.active{background:var(--azul);color:#fff}
.envbar .tag{font-size:11px;color:var(--text3);align-self:center;padding:0 8px}
/* Mobile frame */
.devicewrap{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;padding:10px}
.phone{width:340px;height:700px;border:10px solid #10131a;border-radius:36px;overflow:hidden;background:var(--bg);box-shadow:var(--shadow-lg);position:relative}
.phone .p-scroll{height:100%;overflow:auto}
.phone .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:22px;background:#10131a;border-radius:0 0 14px 14px;z-index:5}
.gcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.progress{height:8px;background:var(--surface2);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--verde)}
.small{font-size:12px;color:var(--text2)}
.divider{height:1px;background:var(--border);margin:14px 0}
.tag2{display:inline-block;font-size:11px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:2px 7px}
.flow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.flow .fstep{border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;background:var(--surface);white-space:nowrap}
.flow .fstep.cur{border-color:var(--azul);background:var(--p-azul);color:var(--azul);font-weight:700}
.flow .fstep.done{border-color:#bfe9cf;background:var(--p-verde);color:var(--t-verde)}
.flow .arr{color:var(--text3)}

<script>

function openDrawer(id){S.drawerId=id;S.drawerTab='resumo';render();}

function setDrawerTab(t){S.drawerTab=t;render();}
function drawer(){
  const d=DEMANDAS.find(x=>x.id===S.drawerId);if(!d)return'';
  const tabs=['resumo','briefing','equipe','checklist','links','versoes','aprovacoes','comentarios','historico',(d.tipo==='Impresso'?'impressao':'publicacao')];
  const tlab={resumo:'Resumo',briefing:'Briefing',equipe:'Responsáveis',checklist:'Checklist',links:'Links (Drive)',versoes:'Versões',aprovacoes:'Aprovações',comentarios:'Comentários',historico:'Histórico',publicacao:'Publicação',impressao:'Impressão'};
  const tabHtml=tabs.map(t=>`<div class="dtab ${S.drawerTab===t?'active':''}" onclick="setDrawerTab('${t}')">${tlab[t]}</div>`).join('');
  return `<div class="overlay" onclick="if(event.target===this)closeDrawer()"><div class="drawer">
    <div class="d-head"><div style="display:flex;align-items:center;gap:10px"><span class="tag2">${d.tipo}</span>${stChip(d.status)}${d.atraso?`<span class="chip st-atraso"><span class="dot"></span>Em atraso ${d.atraso}d</span>`:''}<div style="margin-left:auto"><button class="iconbtn" onclick="closeDrawer()">✕</button></div></div>
      <h2 style="margin:10px 0 2px;font-size:18px">${d.titulo}</h2>
      <div class="small">${d.sec} · Solicitado por ${d.solic} · Versão vigente ${d.versao}</div></div>
    <div class="d-tabs">${tabHtml}</div>
    <div class="d-body">${drawerBody(d)}</div></div></div>`;
}
function drawerBody(d){
  switch(S.drawerTab){
    case 'resumo':return `
      ${kv('Status',stChip(d.status))}${kv('Prioridade',priChip(d.pri))}${kv('Prazo',d.prazo+(d.hora&&d.hora!=='—'?' · '+d.hora:''))}
      ${kv('Secretaria',d.sec)}${kv('Responsável',avatar(d.resp)+' '+d.resp)}${kv('Membros','<div class="avstack">'+d.membros.map(m=>avatar(m)).join('')+'</div>')}

        <button class="btn sm" onclick="toast('Enviado para aprovação (simulado)')">Enviar para aprovação</button>
        <button class="btn sm danger" onclick="openReabrir(${d.id})">Reabrir…</button></div>`;

    case 'equipe':return `${kv('Responsável',avatar(d.resp)+' '+d.resp)}${kv('Membros','<div class="avstack">'+d.membros.map(m=>avatar(m)).join('')+'</div>')}
      <div class="small" style="margin-top:12px">Membros têm participação operacional completa: comentar, adicionar links, cadastrar versões, atualizar checklist e <b>movimentar as etapas de produção</b>. Ações críticas permanecem com Diretor/Coordenador.</div>`;
    case 'checklist':return ['Roteiro/briefing aprovado internamente','Arte na identidade visual','Revisão ortográfica','Conferência de dados','Versão final no Drive'].map((c,i)=>`<label style="display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--border)"><input type="checkbox" ${i<2?'checked':''}> ${c}</label>`).join('');

    case 'versoes':return versoesTab(d);
    case 'aprovacoes':return aprovacoesTab(d);
    case 'comentarios':return `${[['Marina Braga','Ajustar o título para ficar mais curto.'],['Ana Ribeiro','Feito! Subi nova versão.']].map(c=>`<div class="msg" style="margin-bottom:12px">${avatar(c[0])}<div><div class="m-meta"><b style="color:var(--text)">${c[0]}</b> · hoje</div><div class="m-b">${c[1]}</div></div></div>`).join('')}

      <div style="display:flex;gap:8px;margin-top:12px"><button class="btn sm" onclick="toast('Aprovado (simulado)')">Aprovar</button><button class="btn primary sm" onclick="toast('Liberado para publicação (simulado)')">Liberar para publicação</button></div>`;
    case 'impressao':return impressaoTab(d);
  }
}
function kv(k,v){return `<div class="kv"><div class="k">${k}</div><div class="v">${v}</div></div>`;}
function versoesTab(d){const vs=[['V1','Rascunho','st-neutro'],['V2','Substituída','st-neutro'],['V3','Aprovada','st-aprovado'],['V4','Liberada para impressão','st-aprovado']].filter((v,i)=>i< (parseInt((d.versao||'V1').replace('V',''))||1)+1);

   ${vs.map(v=>`<div style="display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dashed var(--border)">
     <span class="tag2">${v[0]}</span><a href="#" onclick="return false" style="flex:1">🔗 drive.google.com/…/${d.id}-${v[0]}</a>
     <span class="chip ${v[2]}"><span class="dot"></span>${v[1]}</span></div>`).join('')}
   <button class="btn sm" style="margin-top:12px" onclick="toast('Nova versão criada — aprovações anteriores invalidadas (simulado)')">＋ Adicionar nova versão</button>`;}
function aprovacoesTab(d){
  if(d.tipo==='Impresso'){return `<div class="alert warn" style="margin-bottom:12px">Impresso exige <b>duas aprovações da mesma versão</b> (Coordenador e Diretor). Só depois surge a ação única “Liberar para impressão”.</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div class="gcard" style="margin:0"><b>Coordenador</b> — ${d.status==='aprovCoord'?'<span class="chip st-aprovacao"><span class="dot"></span>Pendente</span>':'<span class="chip st-aprovado"><span class="dot"></span>Aprovado '+d.versao+'</span>'}</div>
      <div class="gcard" style="margin:0"><b>Diretor</b> — ${['aprovDois','liberadoImp','confGrafica','pedidoConf','prodGrafica'].includes(d.status)?'<span class="chip st-aprovado"><span class="dot"></span>Aprovado '+d.versao+'</span>':'<span class="chip st-neutro"><span class="dot"></span>Aguardando</span>'}</div>
    </div>
    ${['aprovDois','liberadoImp'].includes(d.status)?`<button class="btn primary" style="margin-top:12px" onclick="openLiberar(${d.id})">Liberar para impressão</button>`:'<button class="btn" style="margin-top:12px" disabled>Liberar para impressão (aguardando 2 aprovações)</button>'}`;}
  return `<div class="alert info" style="margin-bottom:12px">Digital/Audiovisual: basta a aprovação de <b>um</b> — Diretor ou Coordenador — vinculada à versão.</div>
    ${['aprovado','pubAguard','publicado'].includes(d.status)?'<div class="gcard" style="margin:0"><b>Aprovado</b> por Marina Braga (Coordenadora) · '+d.versao+' · hoje 10:20</div>':'<div class="gcard" style="margin:0">Aguardando aprovação da versão '+d.versao+'</div>'}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
      <button class="btn sm" onclick="toast('Aprovado (simulado)')">Aprovar</button>
      <button class="btn sm" onclick="toast('Aprovado com observação (simulado)')">Aprovar c/ observação</button>
      <button class="btn sm danger" onclick="toast('Correção solicitada (simulado)')">Solicitar correção</button>
      <button class="btn sm danger" onclick="toast('Reprovado (simulado)')">Reprovar</button></div>`;}
function impressaoTab(d){return `<div class="flow" style="margin-bottom:14px">
   ${['Aprov. Coord.','Aprov. Diretor','Liberado','Confirmação gráfica','Produção','Entregue'].map((s,i)=>{const idx=['aprovCoord','aprovDir','liberadoImp','confGrafica','prodGrafica','entregue'];const cur=idx.indexOf(d.status);return `<span class="fstep ${i<cur?'done':i===cur?'cur':''}">${s}</span>${i<5?'<span class="arr">→</span>':''}`;}).join('')}</div>
   ${kv('Gráfica selecionada','Gráfica Boa Impressão')}${kv('Versão liberada','<span class="tag2">'+d.versao+'</span>')}${kv('Local de entrega','Coordenação de '+d.sec)}${kv('Prazo',d.prazo)}
   <div class="alert warn" style="margin-top:12px">Substituir uma versão liberada invalida as aprovações e a confirmação da gráfica, retornando o pedido para “Aguardando confirmação da gráfica”.</div>
   <div style="display:flex;gap:8px;margin-top:12px">${['aprovDois','liberadoImp'].includes(d.status)?`<button class="btn primary sm" onclick="openLiberar(${d.id})">Liberar para impressão</button>`:''}<button class="btn sm" onclick="toast('Selecionar gráfica (simulado)')">Selecionar gráfica</button></div>`;}
function histTab(d){const h=[['Criada por Marina Braga','21/08/2026 09:12'],['Distribuída para '+d.resp,'21/08/2026 09:40'],['Movida para '+d.etapa,'22/08/2026 14:03'],['Nova versão '+d.versao+' cadastrada','23/08/2026 11:15']];
  return h.map(x=>`<div style="display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--border)"><span style="color:var(--azul)">●</span><div><div>${x[0]}</div><div class="small">${x[1]}</div></div></div>`).join('');}
</script>
<script>
/* ================= Modais / toasts ================= */
function modal(html){mroot().innerHTML=`<div class="center-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;}
function closeModal(){mroot().innerHTML='';}
function openReabrir(id){modal(`<div class="m-head">Reabrir demanda<button class="iconbtn" onclick="closeModal()">✕</button></div>
  <div class="m-body"><div class="alert info" style="margin-bottom:12px">Apenas Diretor/Coordenador. O histórico é preservado; um novo evento de reabertura é criado.</div>
  <div class="field"><label>Etapa de retorno</label><select><option>Em criação</option><option>Revisão interna</option><option>Aguardando publicação</option></select></div>
  <div class="field"><label>Justificativa (obrigatória)</label><textarea placeholder="Descreva o motivo da reabertura"></textarea>
  <div class="hint">Se voltar para etapa anterior à aprovação, as aprovações permanecem no histórico, mas deixam de valer para nova publicação.</div></div></div>
  <div class="m-foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="closeModal();toast('Demanda reaberta (simulado)')">Reabrir</button></div>`);}
function openLiberar(id){modal(`<div class="m-head">Liberar para impressão<button class="iconbtn" onclick="closeModal()">✕</button></div>
  <div class="m-body"><div class="alert ok" style="margin-bottom:12px">✔ Coordenador e Diretor aprovaram a mesma versão. Ação única disponível (Diretor ou Coordenador).</div>
  <div class="small">Antes de liberar, confira: gráfica selecionada, quantidade, prazo, formato e local de entrega. A liberação não ocorre automaticamente.</div>
  ${kv('Gráfica','Gráfica Boa Impressão')}${kv('Quantidade','5.000 un')}${kv('Prazo','25/08/2026')}</div>
  <div class="m-foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="closeModal();toast('Liberado! Pedido enviado para “Aguardando confirmação da gráfica”.')">Confirmar liberação</button></div>`);}
function openTriagem(proto){const s=SOLICITACOES.find(x=>x.proto===proto);
  modal(`<div class="m-head">Triagem · ${proto}<button class="iconbtn" onclick="closeModal()">✕</button></div>
  <div class="m-body"><b>${s.titulo}</b><div class="small" style="margin:6px 0 12px">${s.solic} · ${s.sec} · Prazo ${s.prazo}</div>
  ${kv('Data',s.data)}${kv('Urgência',s.urg)}${kv('Status',s.status)}
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
    <button class="btn sm" onclick="closeModal();toast('Informações solicitadas (simulado)')">Solicitar informações</button>
    <button class="btn sm" onclick="closeModal();toast('Prazo ajustado (simulado)')">Ajustar prazo</button>
    <button class="btn sm danger" onclick="closeModal();toast('Recusada (simulado)')">Recusar</button></div></div>
  <div class="m-foot"><button class="btn" onclick="closeModal()">Fechar</button><button class="btn primary" onclick="closeModal();toast('Aprovada e transformada em demanda (simulado)')">Aprovar → Criar demanda</button></div>`);}
function openNovoUsuario(){modal(`<div class="m-head">Criar usuário<button class="iconbtn" onclick="closeModal()">✕</button></div>
  <div class="m-body">
   <div class="flow" style="margin-bottom:14px"><span class="fstep cur">1 Dados</span><span class="arr">→</span><span class="fstep">2 Cargo</span><span class="arr">→</span><span class="fstep">3 Vínculo</span><span class="arr">→</span><span class="fstep">4 Convite</span></div>
   <div class="field"><label>Nome completo</label><input placeholder="Nome do usuário"></div>
   <div class="field"><label>E-mail (identificador principal)</label><input placeholder="usuario@maracas.ba.gov.br"></div>
   <div class="field"><label>Cargo</label><select><option>Solicitante</option><option>Designer</option><option>Coordenador</option><option>Gráfica</option></select></div>
   <div class="field"><label>Secretaria / Unidade (quando solicitante)</label><select><option>Saúde › Vig. Sanitária</option><option>Educação</option></select></div>
   <div class="alert info">A conta será criada como “Aguardando ativação” e um convite de e-mail (link de uso único, 24 h) será enviado. Sem envio real neste protótipo.</div></div>
  <div class="m-foot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="closeModal();toast('Convite enviado (simulado) · conta “Aguardando ativação”')">Criar e enviar convite</button></div>`);}
function openNotif(){modal(`<div class="m-head">Notificações<button class="iconbtn" onclick="closeModal()">✕</button></div>
  <div class="m-body">${[['🔴','Panfleto da dengue tornou-se atrasado','há 2 h'],['✔','Card raiva animal aguardando sua aprovação','há 3 h'],['🖶','Crachás: gráfica confirmou a versão','hoje 09:10'],['💬','Você foi mencionado em #Criação','hoje 10:02']].map(n=>`<div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--border)"><span>${n[0]}</span><div style="flex:1">${n[1]}<div class="small">${n[2]}</div></div></div>`).join('')}
  <div class="small" style="margin-top:10px">Rotineiras aparecem aqui; e-mail só para eventos importantes (v2.2).</div></div>`);}
function openPerfil(){modal(`<div class="m-head">Perfil<button class="iconbtn" onclick="closeModal()">✕</button></div>
  <div class="m-body" style="text-align:center">${avatar(USER.nome,true)}<h3 style="margin:10px 0 2px">${USER.nome}</h3><div class="small">${USER.cargo}</div>
  <div class="divider"></div><div style="text-align:left">${kv('E-mail','marina@maracas.ba.gov.br')}${kv('Fuso','America/Sao_Paulo')}${kv('Idioma','Português (Brasil)')}</div></div>
  <div class="m-foot"><button class="btn danger" onclick="closeModal();go('login','login')">Sair</button><button class="btn" onclick="closeModal()">Fechar</button></div>`);}
function toast(msg){const t=document.createElement('div');t.textContent=msg;
  t.style.cssText='position:fixed;bottom:64px;left:50%;transform:translateX(-50%);background:#1F2430;color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;z-index:80;box-shadow:var(--shadow-lg);max-width:90vw';
  document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
function todayStr(){return '24/08/2026';}
</script>
<script>
/* ================= PORTAL DO SOLICITANTE ================= */
function portalSolicitante(){
  if(S.screen==='nova')return portalNova();
  if(S.screen==='detalheSolic')return portalDetalheSolic();
  const mine=SOLICITACOES;
  return `<div class="portal"><div class="p-top"><img class="logo" src="${LOGO}"><div style="height:26px;width:1px;background:var(--border)"></div>
    <b>Portal do Solicitante</b><div style="margin-left:auto;display:flex;align-items:center;gap:10px">${avatar('João Meireles')}<div><div style="font-size:13px;font-weight:600">João Meireles</div><div class="small">Secretaria de Saúde</div></div></div></div>
   <div class="p-wrap">
     <div class="page-h"><div><h1>Minhas solicitações</h1><p>Solicitações da Secretaria de Saúde · você vê as da sua secretaria</p></div><div class="spacer"></div><button class="btn primary" onclick="S.wizardStep=1;go('solicitante','nova')">＋ Nova solicitação</button></div>
     <div class="alert info" style="margin-bottom:14px">As solicitações devem ser enviadas com antecedência mínima de <b>24 horas</b> para permitir o planejamento da equipe de Comunicação.</div>
     ${mine.filter(s=>s.sec==='Saúde'||s.proto==='2026-0841').map(s=>`<div class="gcard" onclick="go('solicitante','detalheSolic')" style="cursor:pointer;display:flex;align-items:center;gap:14px">
       <div style="flex:1"><div style="font-weight:600">${s.titulo}</div><div class="small">Protocolo ${s.proto} · ${s.data} · Prazo ${s.prazo}</div></div>
       <span class="chip st-info"><span class="dot"></span>${resumoStatus(s.status)}</span></div>`).join('')}
     <div class="gcard" style="display:flex;align-items:center;gap:14px"><div style="flex:1"><div style="font-weight:600">Card institucional — Dia do Servidor</div><div class="small">Protocolo 2026-0810 · 12/08/2026</div></div><span class="chip st-publicado"><span class="dot"></span>Concluída</span></div>
   </div></div>`;
}
function resumoStatus(s){const map={'Em análise':'Em análise','Enviada':'Enviada','Aguardando informações':'Aguardando informações','Aprovada — em planejamento':'Aprovada — em planejamento'};return map[s]||s;}
function portalNova(){
  const steps=['Dados básicos','Tipo de material','Informações e briefing','Data e prazo','Links e referências','Revisão e envio'];
  const cur=S.wizardStep;
  const stepper=steps.map((s,i)=>`<div class="step ${i+1===cur?'active':i+1<cur?'done':''}"><span class="n">${i+1<cur?'✓':i+1}</span>${s}</div>`).join('');
  let form='';
  if(cur===1)form=`<div class="field"><label>Título da solicitação</label><input placeholder="Ex.: Card sobre campanha de vacinação"></div>
    <div class="field"><label>Secretaria</label><input value="Saúde" disabled></div>
    <div class="field"><label>Unidade (opcional)</label><select><option>Vig. Epidemiológica</option><option>Vig. Sanitária</option><option>Atenção Básica</option></select></div>`;
  else if(cur===2)form=`<div class="field"><label>Tipo de material</label><select><option>Digital (card, carrossel, stories)</option><option>Audiovisual (vídeo, spot)</option><option>Impresso (panfleto, banner, crachá)</option></select></div>
    <div class="field"><label>Canal desejado</label><input placeholder="Instagram, Facebook, Rádio, Impresso…"></div>`;
  else if(cur===3)form=`<div class="field"><label>Descrição / briefing</label><textarea placeholder="Descreva o objetivo, público e mensagem principal"></textarea></div>
    <div class="field"><label>Informações obrigatórias (datas, locais, nomes)</label><textarea placeholder="Ex.: data do evento, local, telefone de contato"></textarea></div>`;
  else if(cur===4)form=`<div class="field"><label>Data desejada</label><input type="text" value="26/08/2026" ></div>
    <div class="field"><label>Horário</label><input type="text" value="14:00"></div>
    <div class="alert warn">⚠ Antecedência mínima de 24 horas. Solicitações enviadas hoje (24/08/2026) só podem ter prazo a partir de 25/08/2026, no mesmo horário.</div>`;
  else if(cur===5)form=`<div class="field"><label>Links de referência (Google Drive)</label><input placeholder="Cole um link do Drive"></div>
    <div class="alert info">Arquivos são compartilhados por link do Google Drive. Não há upload de arquivos no sistema.</div>`;
  else form=`<div class="card" style="padding:16px">${kv('Título','Card sobre campanha de vacinação')}${kv('Secretaria','Saúde › Vig. Epidemiológica')}${kv('Tipo','Digital')}${kv('Data/horário','26/08/2026 · 14:00')}${kv('Antecedência','✔ Acima de 24 horas')}</div>
    <div class="alert ok" style="margin-top:12px">Tudo certo! Ao enviar, a solicitação recebe um protocolo e entra em análise pela Comunicação.</div>`;
  return `<div class="portal"><div class="p-top"><img class="logo" src="${LOGO}"><div style="height:26px;width:1px;background:var(--border)"></div><b>Nova solicitação</b>
     <div style="margin-left:auto"><button class="btn sm" onclick="go('solicitante','solicitante')">✕ Cancelar</button></div></div>
   <div class="p-wrap" style="max-width:760px"><div class="stepper">${stepper}</div>
     <div class="card" style="padding:20px">${form}</div>
     <div style="display:flex;justify-content:space-between;margin-top:16px">
       <button class="btn" ${cur===1?'disabled':''} onclick="S.wizardStep=Math.max(1,${cur}-1);render()">Voltar</button>
       ${cur<6?`<button class="btn primary" onclick="S.wizardStep=${cur}+1;render()">Continuar</button>`:`<button class="btn primary" onclick="go('solicitante','solicitante');toast('Solicitação enviada! Protocolo 2026-0852 · Em análise.')">Enviar solicitação</button>`}
     </div></div></div>`;
}
function portalDetalheSolic(){return `<div class="portal"><div class="p-top"><img class="logo" src="${LOGO}"><div style="height:26px;width:1px;background:var(--border)"></div><b>Solicitação 2026-0841</b>
   <div style="margin-left:auto"><button class="btn sm" onclick="go('solicitante','solicitante')">← Voltar</button></div></div>
   <div class="p-wrap" style="max-width:760px">
     <div class="page-h"><div><h1>Card sobre vacinação contra raiva animal</h1><p>Protocolo 2026-0841 · Enviada em 22/08/2026</p></div><div class="spacer"></div><span class="chip st-info" style="height:28px"><span class="dot"></span>Em análise</span></div>
     <div class="flow" style="margin-bottom:16px">${['Enviada','Em análise','Aprovada','Em produção','Concluída'].map((s,i)=>`<span class="fstep ${i<1?'done':i===1?'cur':''}">${s}</span>${i<4?'<span class="arr">→</span>':''}`).join('')}</div>
     <div class="card" style="padding:16px;margin-bottom:14px">${kv('Tipo','Digital')}${kv('Canal','Instagram e Facebook')}${kv('Prazo desejado','26/08/2026 · 14h')}${kv('Antecedência','✔ Acima de 24 h')}</div>
     <div class="card" style="padding:16px"><b>Mensagens com a Comunicação</b>
       <div class="msg" style="margin-top:12px">${avatar('Comunicação')}<div><div class="m-meta"><b style="color:var(--text)">Comunicação</b> · hoje</div><div class="m-b">Recebemos sua solicitação! Poderia confirmar o telefone de contato para o card?</div></div></div>
       <div style="display:flex;gap:8px;margin-top:10px"><input style="flex:1;height:40px;border:1px solid var(--border);border-radius:10px;padding:0 12px" placeholder="Responder…"><button class="btn primary sm" onclick="toast('Resposta enviada (simulado)')">Enviar</button></div>
     </div></div></div>`;}
/* ================= PORTAL DA GRÁFICA (mobile-first) ================= */
function portalGrafica(){
  if(S.screen==='pedidoGrafica')return graficaDetalhe();
  const list=PEDIDOS.map(p=>`<div class="gcard" onclick="go('grafica','pedidoGrafica')" style="cursor:pointer">
     <div style="display:flex;justify-content:space-between;align-items:center"><b>${p.id}</b>${stChip(p.status)}</div>
     <div style="font-weight:600;margin:6px 0">${p.titulo}</div>
     <div class="small">${p.qtd} · ${p.formato} · ${p.material}</div>
     <div class="small">Prazo: ${p.prazo} · Entrega: ${p.entrega}</div></div>`).join('');
  return `<div class="portal"><div class="devicewrap"><div class="phone"><div class="notch"></div><div class="p-scroll">
    <div style="background:#fff;border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:10px">
      <span style="background:#fff;border:1px solid var(--border);border-radius:8px;padding:5px"><img src="${LOGO}" style="height:20px"></span><b style="font-size:14px">Portal da Gráfica</b></div>
    <div style="padding:16px"><div class="small" style="margin-bottom:10px">Pedidos atribuídos à Gráfica Boa Impressão</div>${list}</div>
  </div></div>
  <div style="max-width:320px"><h1 style="font-size:20px">Portal da Gráfica</h1><p class="small">Experiência mobile-first. A gráfica vê apenas os pedidos atribuídos, com a ficha técnica e o link da versão vigente liberada. Sem orçamento, sem quadro geral, sem versões substituídas.</p>
    <div class="alert info" style="margin-top:12px">Toque em um pedido para ver a ficha técnica, confirmar a versão e atualizar a produção.</div></div>
  </div></div>`;
}
function graficaDetalhe(){const p=PEDIDOS[0];
  return `<div class="portal"><div class="devicewrap"><div class="phone"><div class="notch"></div><div class="p-scroll">
    <div style="background:#fff;border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px">
      <button class="btn sm" onclick="go('grafica','grafica')">←</button><b style="font-size:14px">${p.id}</b>${stChip(p.status)}</div>
    <div style="padding:16px">
      <b style="font-size:15px">${p.titulo}</b>
      <div class="gcard" style="margin-top:12px">
        ${kv('Quantidade',p.qtd)}${kv('Medidas',p.med)}${kv('Formato',p.formato)}${kv('Material',p.material)}${kv('Acabamento',p.acab)}${kv('Prazo',p.prazo)}${kv('Local de entrega',p.entrega)}</div>
      <div class="gcard"><b>Versão vigente</b><div style="display:flex;align-items:center;gap:8px;margin-top:8px"><span class="tag2">${p.versao}</span><a href="#" onclick="return false">🔗 link liberado</a></div>
        <div class="alert warn" style="margin-top:10px">Utilize somente a versão atualmente liberada. Uma versão substituída exige nova confirmação.</div>
        <button class="btn primary" style="width:100%;margin-top:10px" onclick="toast('Versão confirmada (simulado)')">✔ Confirmar versão</button></div>
      <div class="gcard"><b>Produção</b>
        <div class="flow" style="margin-top:10px">${['Confirmado','Produção','Pronto','Transporte','Entregue'].map((s,i)=>`<span class="fstep ${i===0?'done':i===1?'cur':''}">${s}</span>`).join('')}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
          <button class="btn sm" onclick="toast('Status: Em produção (simulado)')">Em produção</button>
          <button class="btn sm" onclick="toast('Status: Pronto (simulado)')">Pronto</button>
          <button class="btn sm" onclick="toast('Status: Em transporte (simulado)')">Em transporte</button></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
          <button class="btn sm" onclick="toast('Link de foto adicionado (simulado)')">＋ Foto do material</button>
          <button class="btn sm" onclick="toast('Link de comprovante adicionado (simulado)')">＋ Comprovante</button>
          <button class="btn sm danger" onclick="toast('Problema informado (simulado)')">Informar problema</button></div>
        <button class="btn primary" style="width:100%;margin-top:12px" onclick="toast('Entrega registrada (simulado)')">Registrar entrega</button></div>
    </div>
  </div></div>
  <div style="max-width:300px"><h1 style="font-size:20px">Detalhe do pedido</h1><p class="small">Ficha técnica, confirmação de versão e atualização da produção — tudo por links do Drive, sem upload.</p></div>
  </div></div>`;}
/* ================= Init ================= */
go('login','login');
</script>
